[theme]
base = "light"
primaryColor = "#176B63"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#EAE5DA"
textColor = "#202B2F"
linkColor = "#176B63"
codeTextColor = "#25363A"
codeBackgroundColor = "#EAE5DA"
borderColor = "#D2CBC0"
dataframeBorderColor = "#D2CBC0"
dataframeHeaderBackgroundColor = "#EAE5DA"
