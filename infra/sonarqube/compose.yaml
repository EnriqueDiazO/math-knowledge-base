name: mathmongo-sonar
services:
  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Run make sonar-init first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  sonarqube:
    image: sonarqube:26.11.0.134175-community
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Run make sonar-init first}
      SONAR_FORCEAUTHENTICATION: "true"
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "false"
    ports:
      - "127.0.0.1:${SONAR_PORT:-19000}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    restart: unless-stopped
volumes:
  postgres_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
